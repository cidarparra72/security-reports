# Render Blueprint — backend FastAPI (raíz del repo)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: security-reports
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://security-reports-one.vercel.app
      - key: REPORTS_MAX_AGE_DAYS
        value: "7"
      - key: PYTHON_VERSION
        value: "3.13.0"
